# The whole figure. x: a lean into the hop, and back out of it. z: the twirl, one turn counter-clockwise seen from above, at a
# slow start while the hit hangs (to 840 ms), then quick and steady, braked in the last part, 8 degrees past the turn and back.
[[track]]
part = "root"
channel = "rot"
mode = "add"
keys = [
  { t = 0.294, v = [0, 0, 0] },
  { t = 0.382, v = [-9, 0, 0], ease = "ease_in" },
  { t = 0.412, v = [-3, 0, 0], ease = "linear" },
  { t = 0.49412, v = [6, 0, 38], ease = "linear" },
  { t = 0.553, v = [0, 0, 76], ease = "linear" },

]

# The head: chin down on the target in the coil, then up after the thrown enemy, then ahead of the turn.
[[track]]
part = "head"
channel = "rot"
mode = "add"
keys = [
  { t = 0.000, v = [0, 0, 0] },
  { t = 0.224, v = [-10, 0, 0], ease = "smooth" },
  { t = 0.294, v = [-12, 0, 0], ease = "smooth" },
  { t = 0.412, v = [16, 0, 0], ease = "ease_in" },
  { t = 0.529, v = [22, 0, 8], ease = "ease_out" },
  { t = 0.706, v = [6, 0, 20], ease = "smooth" },

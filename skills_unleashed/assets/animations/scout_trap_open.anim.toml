# Scout: Trap Deployment, the trap snapping open. The trap's own clip, not the player's: its parts are read as
# models-src/scout-trap.rig.toml reads them:
#   body     the whole trap: pos in voxels from where it lies (z up), rot its tilt
#   hand_l   the front jaw, hand_r the back jaw: rot.x is how far it is open, 0 (shut, upright) to 90 (flat on the ground)
# It starts when the thrown trap has lost its speed (the throw and the bounces are the script's, not a clip). 600 ms; the
# opening itself takes 0.2 s:
#   0 to 200 ms (0.3333)   the jaws fall open, faster and faster, and hit the ground at 90 degrees
#   200 ms                 the hop (2.6 voxels up, down at 380 ms, a small second one to 470 ms) and the shake, which dies by 560 ms;
#                          the jaws bounce off the ground twice
#   600 ms (1)             at rest: the trap is armed
duration = 600
end = "hold"
blend_in = 0
blend_out = 0

# The front jaw: shut, then down onto the ground, and two bounces off it.
[[track]]
part = "hand_l"
channel = "rot"
mode = "set"
keys = [
  { t = 0.0000, v = [0, 0, 0] },
  { t = 0.3333, v = [90, 0, 0], ease = "ease_in" },
  { t = 0.4200, v = [74, 0, 0], ease = "ease_out" },
  { t = 0.5100, v = [90, 0, 0], ease = "ease_in" },
  { t = 0.5700, v = [84, 0, 0], ease = "ease_out" },
  { t = 0.6300, v = [90, 0, 0], ease = "ease_in" },
  { t = 1.0000, v = [90, 0, 0] },
]

# The back jaw: the same, with bounces a little lower and later, so the two rattle.
[[track]]
part = "hand_r"
channel = "rot"
mode = "set"
keys = [
  { t = 0.0000, v = [0, 0, 0] },
  { t = 0.3333, v = [90, 0, 0], ease = "ease_in" },
  { t = 0.4350, v = [77, 0, 0], ease = "ease_out" },
  { t = 0.5350, v = [90, 0, 0], ease = "ease_in" },
  { t = 0.6000, v = [85, 0, 0], ease = "ease_out" },
  { t = 0.6650, v = [90, 0, 0], ease = "ease_in" },
  { t = 1.0000, v = [90, 0, 0] },
]

# The hop, as the jaws hit the ground: up 2.6 voxels and down, then a small one.
[[track]]
part = "body"
channel = "pos"
mode = "set"
keys = [
  { t = 0.0000, v = [0, 0, 0] },
  { t = 0.3333, v = [0, 0, 0] },
  { t = 0.4833, v = [0, 0, 2.6], ease = "ease_out" },
  { t = 0.6333, v = [0, 0, 0], ease = "ease_in" },
  { t = 0.7083, v = [0, 0, 0.7], ease = "ease_out" },
  { t = 0.7833, v = [0, 0, 0], ease = "ease_in" },
  { t = 1.0000, v = [0, 0, 0] },
]

# The shake: a rattle on all three axes from the hit at 200 ms, gone by 560 ms.
[[track]]
part = "body"
channel = "rot"
mode = "set"
expr = ["sin((t - 200) * 2.6) * 7 * smoothstep(200, 212, t) * (1 - smoothstep(230, 560, t))", "sin((t - 200) * 3.1 + 90) * 6 * smoothstep(200, 212, t) * (1 - smoothstep(230, 560, t))", "sin((t - 200) * 2.1) * 5 * smoothstep(200, 212, t) * (1 - smoothstep(230, 560, t))"]

# The jaws are flat: the hop and the shake start.
[[marker]]
t = 0.3333
name = "open"

# The opening is over: the trap is active from here.
[[marker]]
t = 1.0
name = "armed"

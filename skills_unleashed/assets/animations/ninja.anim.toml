# Ninja: Flash Bomb, the throw. 814 ms; it ends at the impact and holds its last pose until the bomb hits, then the script plays
# `ninja_bounce` (the blast's second flip, a separate clip). A time below is a fraction of it:
#   230 ms = 0.2826 (crouched, the hands behind the back, the head up)   300 ms = 0.3686 (the jump)
#   461 ms = 0.5663 (one whole backflip)   553 ms = 0.6790 (the tuck opens)   679 ms = 0.8342 (the weapon hand behind the head)
#   774 ms = 0.9509 (the bomb leaves the hand)   789 ms = 0.9693 (head down, facing the ground)   814 ms = 1 (the impact pose)
# No borrowed pose: the game's pose 0 is the base and the tracks move it. The
# beats: crouch (low, both hands behind the back, a quick look up), jump into a tucked backflip, one whole turn, the spin goes on and
# eases to a stop head down over the ground; the weapon hand throws from behind the head, swinging over and easing in to the middle
# of the body, and holds there.
# The weapon hand is taken to be the right one, as for the other abilities. The game's launch lifts the player: nothing here moves
# the root's height (its z is not drawn), so the clip runs the same on the ground and in the air, and the player may move through it.
# The bomb is not in this clip: the script throws it from `throw`.
# No blend: every track starts at rest, and the end pose is where `ninja_bounce` starts (the root at 606 there is -114 in that clip).
duration = 814
end = "hold"
blend_in = 0
blend_out = 0

# The whole figure. x is the backflip (positive tips the top backward): a small dip forward in the crouch, then the spin, written as
# keys every 20 ms from a speed curve: the speed ramps up over the takeoff,
# peaks to 401 ms and from there dies away softly, as (1-u)^1.8, to nothing at 789 ms: one whole turn by about 461 ms, then a long
# ease to 597, head down with the face to the ground, creeping on through the throw to 606 at the impact (the blast's turn
# is in ninja_bounce).
[[track]]
part = "root"
channel = "rot"
mode = "add"
keys = [
  { t = 0.0000, v = [0, 0, 0] },
  { t = 0.3440, v = [-6, 0, 0], ease = "smooth" },
  { t = 0.3686, v = [-6, 0, 0] },
  { t = 0.3931, v = [8.4, 0, 0], ease = "linear" },
  { t = 0.4177, v = [51.4, 0, 0], ease = "linear" },

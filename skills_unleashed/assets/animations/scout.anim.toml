# Scout: Trap Deployment, the toss. 900 ms; a time below
# is a fraction of it:
#   200 ms = 0.2222 (hunched, the hands down)        340 ms = 0.3778 (the weapon hand is wound back)
#   400 ms = 0.4444 (the hand passes the hip, at its fastest)   470 ms = 0.5222 (the hand is in front, under the head: the trap goes)
#   600 ms = 0.6667 (the hold is over)               900 ms = 1 (back at rest)
# No borrowed pose: the game's pose 0 is the base and the tracks move it. The
# three beats: hunch (the trunk leans forward and sinks, the head stays level, both hands hang low), toss (the right hand winds a
# little back, then swings forward and up, underhand, to in front of the chest: fast at first, easing into the stop), and back.
# The weapon hand is taken to be the right one, as for the Sniper (not read from the game).
# The player may walk through it: nothing here moves the root, and the game moves the feet.
# The trap is not in this clip: the script draws it, from `spawn`.
# No blend: every track starts and ends at rest.
duration = 900
end = "hold"
blend_in = 0
blend_out = 0

# The trunk leans forward into the hunch, a little more with the throw, and comes back up. z: the right shoulder goes back with the
# wind-up (negative) and forward with the toss.
[[track]]
part = "body"
channel = "rot"
mode = "add"
keys = [
  { t = 0.0000, v = [0, 0, 0] },
  { t = 0.2222, v = [-24, 0, 0], ease = "smooth" },
  { t = 0.3778, v = [-22, 0, -12], ease = "smooth" },
  { t = 0.5222, v = [-28, 0, 14], ease = "smooth" },
  { t = 0.6667, v = [-25, 0, 9], ease = "smooth" },
  { t = 1.0000, v = [0, 0, 0], ease = "smooth" },
]

# The trunk sinks into the knees and shifts forward over the feet; it rises a little with the toss.
[[track]]
part = "body"
channel = "pos"
mode = "add"
keys = [
  { t = 0.0000, v = [0, 0, 0] },
  { t = 0.2222, v = [0, 2.2, -2.2], ease = "smooth" },
  { t = 0.3778, v = [0, 1.8, -2.5], ease = "smooth" },
  { t = 0.5222, v = [0, 2.8, -1.6], ease = "ease_out" },
  { t = 0.6667, v = [0, 2.4, -1.8], ease = "smooth" },
  { t = 1.0000, v = [0, 0, 0], ease = "smooth" },
]

# The weapon hand. A hand's position is in the trunk's frame, so the lean carries it: these offsets are small where the hand only
# hangs from the leaning trunk (the hunch) and large in z where it has to come up against the lean (the toss). Hunch: low by the
# knee. Wind-up: back past the hip. Toss: through the low point at the hip and up to in front of the chest, under the head; a
# small drift on while it holds; then back to the side.
[[track]]
part = "hand_r"
channel = "pos"
mode = "add"
keys = [
  { t = 0.0000, v = [0, 0, 0] },
  { t = 0.2222, v = [0, 1.9, 0.9], ease = "smooth" },
  { t = 0.3778, v = [1.3, -3.2, 0.9], ease = "smooth" },
  { t = 0.4444, v = [-0.4, 1.3, 0.3], ease = "ease_in" },
  { t = 0.5222, v = [-2.1, 5.7, 5.7], ease = "ease_out" },
  { t = 0.6667, v = [-2.8, 6.7, 6], ease = "smooth" },
  { t = 1.0000, v = [0, 0, 0], ease = "smooth" },
]

# The palm: x 0 as at rest, negative turns it up. Back with the wind-up, up and open as the trap leaves the hand.
[[track]]
part = "hand_r"
channel = "rot"
mode = "add"
keys = [
  { t = 0.0000, v = [0, 0, 0] },
  { t = 0.3778, v = [25, 0, 0], ease = "smooth" },
  { t = 0.5222, v = [-80, 0, 0], ease = "ease_out" },
  { t = 0.6667, v = [-85, 0, 0], ease = "smooth" },
  { t = 1.0000, v = [0, 0, 0], ease = "smooth" },
]

# The other hand: low by the knee with the hunch, a little back with the toss, for balance.
[[track]]
part = "hand_l"
channel = "pos"
mode = "add"
keys = [
  { t = 0.0000, v = [0, 0, 0] },
  { t = 0.2222, v = [0, 1.9, 0.9], ease = "smooth" },
  { t = 0.3778, v = [-0.8, 1.7, 1.1], ease = "smooth" },
  { t = 0.5222, v = [-0.6, -1.6, 0.7], ease = "ease_out" },
  { t = 0.6667, v = [-0.5, -1.5, 0.7], ease = "smooth" },
  { t = 1.0000, v = [0, 0, 0], ease = "smooth" },
]

# The player's weapon is away for the whole clip.
[[hide]]
from = 0.0
to = 1.0
parts = ["weapons"]

# The weapon hand is in front of the body: the trap appears there and flies on.
[[marker]]
t = 0.5222
name = "spawn"

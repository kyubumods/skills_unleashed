# Ninja: Flash Bomb, the throw when the player is already in the air, made from ninja.anim.toml. The script plays this clip in
# place of ninja.anim.toml when the ability starts off the ground; the push up is the script's in both. 514 ms; a time below is
# a fraction of it:
#   0 ms (the push up and the flip start at once)   160 ms = 0.3113 (one whole backflip)   253 ms = 0.4922 (the tuck opens)
#   379 ms = 0.7374 (the weapon hand behind the head)   474 ms = 0.9222 (the bomb leaves the hand)   489 ms = 0.9514 (head down)
#   514 ms = 1 (the impact pose)
# No crouch and no windup: the backflip starts on the first frame. Every track is the ground
# clip's from its takeoff (300 ms) on, 300 ms earlier, so it ends on the same pose and the same `ninja_bounce` follows the impact.
# No blend: every track starts at rest, and the end pose is where `ninja_bounce` starts (the root at 606 there is -114 in that clip).
duration = 514
end = "hold"
blend_in = 0
blend_out = 0

# The whole figure. x is the backflip, keys every 20 ms from a speed curve (spin_keys.py air): the speed ramps up over the first
# 38 ms, peaks to 101 ms and dies away softly, as (1-u)^1.8, to nothing at 489 ms, head down with the face to the ground at 597,
# creeping on through the throw to 606 at the impact (the blast's turn is in ninja_bounce).
[[track]]
part = "root"
channel = "rot"
mode = "add"
keys = [
  { t = 0.0000, v = [0, 0, 0] },
  { t = 0.0389, v = [14.2, 0, 0], ease = "linear" },
  { t = 0.0778, v = [56.8, 0, 0], ease = "linear" },
  { t = 0.1167, v = [111.0, 0, 0], ease = "linear" },
  { t = 0.1556, v = [165.1, 0, 0], ease = "linear" },
  { t = 0.1946, v = [219.2, 0, 0], ease = "linear" },
  { t = 0.2335, v = [271.1, 0, 0], ease = "linear" },
  { t = 0.2724, v = [318.2, 0, 0], ease = "linear" },
  { t = 0.3113, v = [360.7, 0, 0], ease = "linear" },
  { t = 0.3502, v = [398.7, 0, 0], ease = "linear" },
  { t = 0.3891, v = [432.6, 0, 0], ease = "linear" },
  { t = 0.4280, v = [462.5, 0, 0], ease = "linear" },
  { t = 0.4669, v = [488.7, 0, 0], ease = "linear" },
  { t = 0.5058, v = [511.3, 0, 0], ease = "linear" },
  { t = 0.5447, v = [530.7, 0, 0], ease = "linear" },
  { t = 0.5837, v = [546.9, 0, 0], ease = "linear" },
  { t = 0.6226, v = [560.4, 0, 0], ease = "linear" },
  { t = 0.6615, v = [571.3, 0, 0], ease = "linear" },
  { t = 0.7004, v = [579.8, 0, 0], ease = "linear" },
  { t = 0.7393, v = [586.3, 0, 0], ease = "linear" },
  { t = 0.7782, v = [590.9, 0, 0], ease = "linear" },
  { t = 0.8171, v = [594.0, 0, 0], ease = "linear" },
  { t = 0.8560, v = [595.9, 0, 0], ease = "linear" },
  { t = 0.8949, v = [596.7, 0, 0], ease = "linear" },
  { t = 0.9339, v = [597.0, 0, 0], ease = "linear" },
  { t = 0.9514, v = [597.0, 0, 0], ease = "linear" },
  { t = 1.0000, v = [606, 0, 0], ease = "smooth" },

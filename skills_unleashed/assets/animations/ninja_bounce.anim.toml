# Ninja: Flash Bomb, the bounce. Played by the script when the bomb hits (the throw clip, ninja.anim.toml, holds its last pose until
# then), while the blast throws the player away from the impact; 1000 ms. It starts from the throw clip's end pose
# (head down: the root's 606 there is -114 here, the same turn) and does one more backflip: the blast's
# kick finishes the turn under way and carries into a whole tucked flip, which then eases out to upright. A time below is a fraction:
#   70 ms = 0.07 (the kick: arms flung out wide, the trunk arched)   140 ms = 0.14 (upright again, into the extra flip)
#   250 ms = 0.25 (tucked)   500 ms = 0.5 (the tuck opens)   850 ms = 0.85 (the flip is done)   1000 ms = 1 (at rest)
# The weapon hand is the right one, as in the throw clip. Nothing here moves the root's height or place: the launch is the script's.
# No blend: every track starts at the throw clip's end pose and ends at rest or one whole turn from it.
duration = 1000
end = "hold"
blend_in = 0
blend_out = 0

# The whole figure. x is the backflip, written as keys every 20 ms from a speed curve:
# the kick takes the speed to its peak in 40 ms, it holds through the tuck to 250 ms, then dies away softly, as
# (1-u)^2, to nothing at 850 ms, at 360.
[[track]]
part = "root"
channel = "rot"
mode = "add"
keys = [
  { t = 0.0000, v = [-114, 0, 0] },
  { t = 0.0200, v = [-108.5, 0, 0], ease = "linear" },
  { t = 0.0400, v = [-92.0, 0, 0], ease = "linear" },

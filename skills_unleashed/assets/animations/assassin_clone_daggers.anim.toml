# Assassin: Shadow Strike, the clones' strike with the dual blades: both start at the sides and thrust forward together. Played by lib/shadow on a clone at its
# own age: it sets off from its corner at 0, passes the target at 170 ms = 0.315 (the strike), ends its line at 340 ms = 0.63 and
# has faded by 540 ms = 1. Bound to skills_unleashed:assassin_clone_daggers, an ability on no bar. Tracks over pose 0; the weapons are shown (the clones carry the
# player's items). Keys every 10 ms through the strike, solved from where each hand should be with the lean and the turn taken out.
duration = 540
end = "hold"
blend_in = 0
blend_out = 0

